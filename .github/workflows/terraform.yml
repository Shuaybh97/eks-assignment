name: Terraform

on:
  push:
    branches: [master]
    paths:
      - 'Infrastructure/**'
  pull_request:
    branches: [master]
    paths:
      - 'Infrastructure/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '~> 1.10.0'
  ENVIRONMENT: 'sandbox'

jobs:
  lint-and-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: Infrastructure
        run: terraform fmt -check -recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Infrastructure
          framework: terraform
          soft_fail: true

  plan-core:
    name: Plan Core Infrastructure
    runs-on: ubuntu-latest
    environment: sandbox
    needs: lint-and-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-oidc-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: Infrastructure/terraform/core
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/core.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: Infrastructure/terraform/core
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: Infrastructure/terraform/core
        run: |
          terraform plan \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars" \
            -no-color
        continue-on-error: true

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-core:
    name: Apply Core Infrastructure
    runs-on: ubuntu-latest
    environment: sandbox
    needs: plan-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-oidc-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: Infrastructure/terraform/core
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/core.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: Infrastructure/terraform/core
        run: terraform apply -auto-approve -var-file="environments/${{ env.ENVIRONMENT }}.tfvars"

  plan-helm-releases:
    name: Plan Helm Releases
    runs-on: ubuntu-latest
    environment: sandbox
    needs: apply-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-oidc-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: Infrastructure/terraform/helm
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        id: plan
        working-directory: Infrastructure/terraform/helm
        run: |
          terraform plan \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars" \
            -no-color
        continue-on-error: true

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-helm-releases:
    name: Apply Helm Releases
    runs-on: ubuntu-latest
    environment: sandbox
    needs: plan-helm-releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-oidc-${{ env.ENVIRONMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: Infrastructure/terraform/helm
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: Infrastructure/terraform/helm
        run: |
          terraform apply -auto-approve \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars"
