# AWS Secrets Store CSI Driver Provider configuration
# Automatically installs the Secrets Store CSI driver as a dependency

# Install the upstream Secrets Store CSI driver
secrets-store-csi-driver:
  install: true
  # Configure token requests for IRSA and EKS Pod Identity
  tokenRequests:
    - audience: "sts.amazonaws.com"
    - audience: "pods.eks.amazonaws.com"
  syncSecret:
    enabled: false
  enableSecretRotation: false
